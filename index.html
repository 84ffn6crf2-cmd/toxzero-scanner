<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tox Zero Scanner</title>
<meta name="description" content="Scan a beauty product. Ingredients and packaging, every scan, and the swaption if it fails.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#CFE4EA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tox Zero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.1-1.5 2.1v.4M12 18h.01"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17zM12 10.5v3.5M12 17h.01"/></symbol>
  <symbol id="i-dash" viewBox="0 0 24 24"><path d="M7 12h10"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s-6 6.6-6 11a6 6 0 0 0 12 0c0-4.4-6-11-6-11z"/></symbol>
  <symbol id="i-bottle" viewBox="0 0 24 24"><path d="M9.5 3h5M10.5 3v3.5L8 9.5V20a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V9.5l-2.5-3V3"/></symbol>
  <symbol id="i-owner" viewBox="0 0 24 24"><path d="M4 21V9l8-5 8 5v12M9.5 21v-5h5v5M3 21h18"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><path d="M3 6.5h18v11H3zM7 10.5h.01M11 10.5h.01M15 10.5h.01M7.5 14h9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6h.01"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9.5 3h5M10.5 3v6L5.6 17.6A2.3 2.3 0 0 0 7.6 21h8.8a2.3 2.3 0 0 0 2-3.4L13.5 9V3M7.6 15h8.8"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7z"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M16.5 9v6"/></symbol>
</svg>

<header class="bar">
  <a class="mark" href="#/" aria-label="Tox Zero Scanner home"><img src="icons/icon-192.png" alt=""><span>TOX ZERO</span></a>
  <nav>
    <a href="#/standard" class="glass">standard</a>
    <a href="#/history" class="glass">history</a>
  </nav>
</header>

<main id="app">
  <section id="home" class="view">
    <h1 class="title">scan.<br>get answers.</h1>
    <p class="sub">Ingredients + packaging, every scan.</p>

    <div class="finder glass" id="finder">
      <video id="video" playsinline muted></video>
      <div class="reticle" aria-hidden="true"></div>
      <button class="pill glass small" id="torchBtn" type="button" hidden aria-label="Flash"><svg class="i"><use href="#i-bolt"/></svg>Flash</button>
      <button class="pill navy" id="startBtn" type="button"><svg class="i"><use href="#i-scan"/></svg>Start scanning</button>
      <button class="pill navy small" id="stopBtn" type="button" hidden>Stop</button>
      <p class="camMsg" id="camMsg" hidden></p>
    </div>

    <div class="row">
      <label class="pill glass" for="photoInput"><svg class="i"><use href="#i-camera"/></svg>Photo</label>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      <button class="pill glass" id="typeBtn" type="button"><svg class="i"><use href="#i-keys"/></svg>Type it</button>
    </div>
    <form class="codeForm" id="codeForm" hidden>
      <div class="field glass" style="flex:1"><input id="codeInput" inputmode="numeric" pattern="[0-9 ]*" placeholder="barcode digits" aria-label="Barcode number" autocomplete="off"></div>
      <button class="pill navy" type="submit">Check</button>
    </form>

    <form class="search" id="searchForm" role="search">
      <div class="field glass"><svg class="i"><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="search a brand or product" aria-label="Search by name" autocomplete="off"></div>
    </form>

    <p class="label">TRY ONE</p>
    <div class="chips demo">
      <button type="button" class="chip glass" data-code="0812154030013">Native deodorant</button>
      <button type="button" class="chip glass" data-code="0077326470176">Tom's toothpaste</button>
      <button type="button" class="chip glass" data-code="0634084028010">Badger Baby Balm</button>
      <button type="button" class="chip glass" data-code="0634084331646">Badger lip balm</button>
      <button type="button" class="chip glass" data-code="0860000424240">Unknown product</button>
    </div>
  </section>

  <section id="panel" class="view" hidden></section>
</main>

<footer class="foot">
  <p>Only the Tox Zero standard approves. Product data: <a href="https://world.openbeautyfacts.org" target="_blank" rel="noopener">Open Beauty Facts</a>, <a href="https://opendatacommons.org/licenses/odbl/1-0/" target="_blank" rel="noopener">ODbL</a>.</p>
</footer>

<div class="sheet" id="sheet" hidden aria-live="polite">
  <div class="grab" id="grab" data-drag aria-label="Pull up for details"><i></i></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="info" id="info" hidden>
  <div class="info-card" role="dialog" aria-modal="true">
    <button class="info-x" id="infoClose" type="button" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    <div id="infoBody"></div>
  </div>
</div>

<div class="busy" id="busy" hidden><span></span></div>

<script src="vendor/zxing-library-0.21.3.min.js"></script>
<script type="module" src="app.js?v=12"></script>
</body>
</html>
